[project]
name = "graphrag-scout"
version = "0.1.0"
description = "Minimal Claude Agent SDK agent that keeps a reading list of GraphRAG sources"
requires-python = ">=3.12"
dependencies = ["claude-agent-sdk"]

[project.scripts]
scout = "scout:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["scout.py"]
